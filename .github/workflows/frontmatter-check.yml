name: Check docs frontmatter

on:
  pull_request:
    branches:
      - production
      - development

jobs:
  check-frontmatter:
    name: Check docs frontmatter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run frontmatter check
        run: yarn check:frontmatter


