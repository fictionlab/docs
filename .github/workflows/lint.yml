name: Lint

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - production
      - development

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check Types
        run: yarn typecheck

      - name: Check Formatting
        run: yarn formatcheck

      - name: Check spelling
        run: yarn spellcheck
